<style>
:root{
  --ice:#f2f5f8; --card:#ffffff; --ink:#0b1320; --ink2:#3b4658; --muted:#7a8597; --line:#dfe6ed;
  --night:#0b1320; --night2:#162234; --red:#d62839; --blue:#1f4fd8; --cyan:#19a7c4;
  --gold:#d62839; --gold2:#b51f2e; --green:#16935a; --yes:#16935a; --lean:#1f4fd8;
  --winbg:#eaf6ef; --winln:#c3e5d1; --lossbg:#fdeeef; --lossln:#f4c7cb;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{background:var(--ice);color:var(--ink);font-family:Archivo,system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;line-height:1.45}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:
 linear-gradient(90deg,transparent calc(50% - 1px),rgba(214,40,57,.05) calc(50% - 1px),rgba(214,40,57,.05) calc(50% + 1px),transparent calc(50% + 1px)),
 radial-gradient(circle at 50% 48%,transparent 140px,rgba(31,79,216,.05) 141px,rgba(31,79,216,.05) 143px,transparent 144px);z-index:0}
a{color:inherit;text-decoration:none}
.D,.label,.kicker,h1.huge,.sec-h h2,.giant,.big2,.mood,.poll .rk,.statbig,.res,.pk,.tile .v,.pct,.val,.wk{font-family:'Bebas Neue',Oswald,Impact,sans-serif;font-weight:400;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.label{text-transform:uppercase;letter-spacing:.12em;font-size:14px}
/* header */
.hdr{position:sticky;top:0;z-index:10;background:var(--night);color:#fff;box-shadow:0 2px 0 var(--red)}
.hrow{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 28px 6px}
.brand{display:flex;align-items:center;gap:12px}
.crest{width:30px;height:37px;flex:none}
.puck{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a4357,#05080e 70%);box-shadow:0 0 0 3px var(--red),0 0 18px rgba(214,40,57,.55);flex:none}
.b1{font-family:'Bebas Neue',Impact,sans-serif;font-size:30px;line-height:.9;letter-spacing:.06em}
.b2{font-size:11px;color:#9aa6ba;letter-spacing:.14em;text-transform:uppercase}
.sp{flex:1}
.mpill{font-family:'Bebas Neue',sans-serif;letter-spacing:.12em;font-size:15px;padding:5px 12px;border-radius:999px;border:1px solid #2b3a52;color:#cfd8e6;white-space:nowrap}
.chip{display:flex;align-items:center;gap:8px}
.chip select{background:var(--night2);color:#fff;border:1px solid #2b3a52;border-radius:8px;padding:6px 8px;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.08em}
.nav{max-width:1240px;margin:0 auto;display:flex;gap:2px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{display:flex;align-items:center;gap:6px;padding:10px 10px 12px;font-family:'Bebas Neue',sans-serif;letter-spacing:.08em;font-size:16px;color:#9aa6ba;white-space:nowrap;border-bottom:3px solid transparent}
.nav a:hover{color:#fff}
.nav a.on{color:#fff;border-bottom-color:var(--red)}
.nsep{flex:none;width:1px;margin:10px 8px 14px;background:#2b3a52}
.nav svg{width:15px;height:15px;flex:none}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:30px 28px 70px}
footer{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:12px;padding:0 0 30px;letter-spacing:.06em}
/* type */
.kicker{color:var(--red);font-size:15px;letter-spacing:.16em;text-transform:uppercase}
h1.huge{font-size:clamp(56px,9vw,112px);line-height:.88;text-transform:uppercase}
.under{width:120px;height:6px;margin:12px 0 12px;background:linear-gradient(90deg,var(--blue) 0 30%,transparent 30% 35%,var(--red) 35% 65%,transparent 65% 70%,var(--blue) 70%)}
.sub{color:var(--ink2);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.sec{margin-top:30px}
.sec-h{margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--line);position:relative}
.sec-h:after{content:"";position:absolute;left:0;bottom:-2px;width:64px;height:2px;background:var(--blue)}
.sec-h h2{font-size:32px;line-height:1;text-transform:uppercase}
.sec-h .kicker{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 1px 0 rgba(11,19,32,.03)}
.card.top-ln{border-top:3px solid var(--ink)}
.grid{display:grid;gap:14px}.grid>*,.wrap,.main{min-width:0}
@media (max-width:560px){.grid[style*=minmax\(400px]{grid-template-columns:minmax(0,1fr)!important}}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.muted{color:var(--muted)}
/* badges and tags */
.badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.06em;color:#fff;flex:none;transform:rotate(-4deg)}
.badge.sm{width:30px;height:30px;font-size:12px;border-radius:8px}
.badge.lg{width:78px;height:78px;font-size:26px;border-radius:18px}
.tag{display:inline-block;font-family:'Bebas Neue',sans-serif;letter-spacing:.12em;font-size:14px;padding:2px 9px 1px;border-radius:5px;color:#fff;vertical-align:middle}
.tag.YES{background:var(--yes)}.tag.LEAN{background:var(--lean)}.tag.SKIP{background:#777}.tag.corr{background:#9a6b00}
.up{color:var(--green)}.dn{color:var(--red)}
/* power poll */
.poll{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px 14px;overflow:hidden;transition:transform .12s,box-shadow .12s}
.poll:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--c1)}
.poll:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(11,19,32,.10)}
.poll .rk{font-size:60px;line-height:.9;color:transparent;-webkit-text-stroke:2px var(--ink)}
.poll .bd{position:absolute;right:14px;top:18px}
.poll .nm{font-weight:800;text-transform:uppercase;font-size:15px;margin-top:10px;letter-spacing:.02em}
.poll .ln{color:var(--muted);font-size:13px;margin-top:4px;font-weight:600}
/* hero */
.hero{display:grid;grid-template-columns:1.1fr 1fr;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#fff}
.hero .l{padding:24px 28px;background:linear-gradient(135deg,var(--night) 0%,var(--night2) 100%);color:#fff;position:relative}
.hero .l:after{content:"";position:absolute;right:-110px;bottom:-110px;width:220px;height:220px;border-radius:50%;border:2px solid rgba(214,40,57,.35)}
.hero .l .note,.hero .l .sub{color:#aeb8c9}
.hero .r{padding:24px 28px;display:flex;flex-direction:column;gap:20px}
.giant{font-size:clamp(96px,12vw,170px);line-height:.8}
.red-k{color:var(--red);font-family:'Bebas Neue',sans-serif;letter-spacing:.16em;font-size:16px}
.hero .l .red-k{color:#ff6b78}
.meter{height:10px;background:#e3e9ef;border-radius:999px;overflow:hidden}
.hero .l .meter{background:rgba(255,255,255,.14)}
.meter i{display:block;height:100%;border-radius:999px}
.big2{font-size:58px;line-height:.9}
.mood{font-size:28px;letter-spacing:.06em}
/* rows */
.metric{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.metric .t{font-weight:700;font-size:16px}.metric .d{color:var(--muted);font-size:13px}
.metric .v{font-weight:800;font-size:21px}
.rankpill{border-radius:6px;padding:3px 10px;font-family:'Bebas Neue',sans-serif;letter-spacing:.06em;font-size:16px;min-width:50px;text-align:center;background:#eef2f6}
.rankpill.bad{color:#fff;background:var(--red)}.rankpill.good{color:#fff;background:var(--green)}
.gl{display:grid;grid-template-columns:auto auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-radius:12px;border:1px solid var(--winln);background:var(--winbg)}
.gl.L{background:var(--lossbg);border-color:var(--lossln)}.gl.N,.gl.SO{background:#fff;border-color:var(--line)}
.wk{background:var(--ink);color:#fff;font-size:14px;padding:2px 8px;border-radius:5px;letter-spacing:.08em}
.gl .res{font-size:22px}
/* tonight */
.game{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.game .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:var(--night);color:#fff}
.game .hd .muted{color:#9aa6ba}
.team-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:12px 16px}
.team-row .tn{font-weight:800;font-size:16px}
.team-row .pct{font-size:34px;line-height:1}
.winbar{display:flex;height:8px;margin:0 16px;border-radius:999px;overflow:hidden;background:#eee;gap:2px}
.sides{padding:6px 16px 14px}
details.more summary{cursor:pointer;font-family:'Bebas Neue',sans-serif;letter-spacing:.12em;font-size:16px;color:var(--blue);padding:8px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:'Bebas Neue',sans-serif;letter-spacing:.12em;font-size:14px;font-weight:400;color:var(--muted);text-align:left;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #edf1f5;white-space:nowrap}
tr.fYES td{background:#ecf7f0}tr.fLEAN td{background:#edf2fd}
.tablewrap{overflow-x:auto;max-width:100%}
.pick{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden}
.pick:before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--lean)}
.pick.YES:before{background:var(--yes)}
.pick .pk{font-size:34px;line-height:1;margin:8px 0 2px}
.kv{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.kv div{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;min-width:0}
.kv b{display:block;color:var(--ink);font-size:19px;letter-spacing:0;text-transform:none}
.spot{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:linear-gradient(120deg,var(--night),var(--night2));color:#fff;border-radius:16px;padding:18px 22px}
.spot .muted{color:#aeb8c9}
.spot .big{font-family:'Bebas Neue',sans-serif;font-size:42px;line-height:.95;letter-spacing:.02em}
/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
.tabs button{border:1px solid var(--line);background:#fff;font-family:'Bebas Neue',sans-serif;letter-spacing:.12em;font-size:17px;padding:7px 16px;border-radius:999px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.ulink{display:flex;gap:24px;border-bottom:2px solid var(--line);margin:18px 0 20px;overflow-x:auto}
.ulink button{background:none;border:0;padding:10px 2px;font-family:'Bebas Neue',sans-serif;letter-spacing:.12em;font-size:19px;color:var(--muted);cursor:pointer;white-space:nowrap;margin-bottom:-2px;border-bottom:3px solid transparent}
.ulink button.on{color:var(--ink);border-bottom-color:var(--red)}
.tcard{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden}
.tcard:after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--tint)}
.tcard .nm{font-weight:800;text-transform:uppercase;font-size:17px;position:relative;z-index:1}
.tcard>div{position:relative;z-index:1}
.tcard sup{font-size:12px;color:var(--ink2);margin-left:4px}
.statbig{font-size:50px;line-height:.95}
.case{padding-bottom:4px}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;background:#fff}
.back{font-family:'Bebas Neue',sans-serif;letter-spacing:.14em;font-size:16px;color:var(--ink2);cursor:pointer;display:inline-block;margin-bottom:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.tile .v{font-size:32px;line-height:1;margin-top:4px}
.lrow{display:grid;grid-template-columns:24px auto 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #edf1f5}
.lrow .n{font-family:'Bebas Neue',sans-serif;color:var(--muted);font-size:20px}
.lrow .val{font-family:'Bebas Neue',sans-serif;font-size:26px}
.cmp{display:grid;grid-template-columns:1fr 190px 1fr;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #edf1f5}
.cmp .lab{text-align:center;font-family:'Bebas Neue',sans-serif;letter-spacing:.1em;font-size:15px;color:var(--ink2)}
.cmp .bar{height:10px;border-radius:999px;background:#e9eef3;overflow:hidden;display:flex}
.cmp .l .bar{justify-content:flex-end}
.cmp .val{font-size:24px}
.cmp .l{text-align:right}
.win{font-family:'Bebas Neue',sans-serif}
.nx{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #edf1f5}
select.big{font-family:'Bebas Neue',sans-serif;letter-spacing:.08em;font-size:22px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:#fff}
@media (min-width:981px){.nav{flex-wrap:wrap}}
h1.huge{font-size:clamp(48px,7vw,84px)}
.tlay{display:grid;grid-template-columns:340px minmax(0,1fr);gap:26px;align-items:start}
.tside{position:sticky;top:112px;background:linear-gradient(165deg,var(--night),var(--night2));color:#fff;border-radius:22px;padding:20px 22px 22px;overflow:hidden;border-top:6px solid var(--acc)}
.tside:after{content:"";position:absolute;left:-80px;bottom:-80px;width:200px;height:200px;border-radius:50%;border:2px solid rgba(214,40,57,.3);pointer-events:none}
.tname{font-size:46px;line-height:.9;margin:10px 0 4px}
.muted2{color:#9aa6ba;font-size:13px}
.srow{display:flex;justify-content:space-between;align-items:flex-end;margin:10px 0 6px;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:10px}
.sblk{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.sblk .meter{background:rgba(255,255,255,.14);margin-top:6px}
.sline{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tside .red-k{color:#ff6b78;font-size:14px}
.sbtn{display:flex;gap:8px;margin-top:14px}
.explain{font-size:13px;line-height:1.45;color:#c3ccda;margin-top:8px}
.vibe{font-family:'Bebas Neue',sans-serif;letter-spacing:.12em;font-size:13px;border:1px solid;border-radius:999px;padding:1px 9px}
.sbtn>*{flex:1;text-align:center;font-family:'Bebas Neue',sans-serif;letter-spacing:.1em;font-size:16px;padding:9px 8px;border-radius:10px;border:1px solid #2b3a52;cursor:pointer}
.sbtn>*:hover{background:#22304a}
.tmain{min-width:0}
.tier{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:3px solid var(--ink);padding-bottom:6px;margin-bottom:6px}
.tier .D{font-size:34px;text-transform:uppercase}
.ladder{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rung{display:grid;grid-template-columns:54px 34px auto minmax(0,1.3fr) minmax(0,1fr) 70px;gap:14px;align-items:center;padding:10px 18px;border-bottom:1px solid #edf1f5;border-left:5px solid var(--c1)}
.rung:last-child{border-bottom:0}
.rung:hover{background:#f6f9fc}
.rnum{font-size:40px;line-height:1}
.mv{font-size:13px;font-weight:700}
.rn{display:flex;flex-direction:column}.rn b{font-size:16px}.rn .muted{font-size:12px}
.pbar{position:relative;height:10px;background:#edf1f5;border-radius:999px}
.pbar i{position:absolute;top:0;bottom:0;border-radius:999px}
.pbar b{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:#b9c4d0}
.pv{font-size:26px;text-align:right}
.ticker{display:flex;gap:10px;overflow-x:auto;margin:-6px 0 22px;padding-bottom:6px;scrollbar-width:thin}
.tk{position:relative;flex:none;display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 14px;min-width:132px}
.tk>span{display:flex;align-items:center;gap:7px;font-size:14px}.tk .D{margin-left:auto;font-size:20px}
.pc .pcg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.pc label{display:flex;flex-direction:column;gap:4px;font-family:'Bebas Neue',sans-serif;letter-spacing:.1em;font-size:14px;color:var(--muted)}
.pc label.ck{flex-direction:row;align-items:center;gap:8px;font-family:Archivo,sans-serif;letter-spacing:0;font-size:14px;color:var(--ink)}
.pin{font-family:Archivo,sans-serif;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;width:100%;margin-top:6px}
.pcg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.tklab{font-family:'Bebas Neue',sans-serif;letter-spacing:.14em;font-size:13px;color:var(--muted,#6b7789);margin:-8px 0 8px}
.tkf{align-self:flex-start;font-family:'Bebas Neue',sans-serif;letter-spacing:.1em;font-size:13px;color:#fff;border-radius:5px;padding:1px 7px}
.tkf.YES{background:var(--yes)}.tkf.LEAN{background:var(--lean)}
@media (max-width:980px){
  .hrow{padding:10px 16px 4px}.b1{font-size:24px}.b2,.mpill{display:none}
  .nav{padding:0 8px}.nav a{font-size:15px;padding:8px 9px 10px}
  .wrap{padding:22px 16px 60px}
  .g5,.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:minmax(0,1fr)}
  h1.huge{font-size:56px!important;overflow-wrap:anywhere}.badge.lg{width:56px;height:56px;font-size:19px}
  #view>div>div,#view>div>div>div{min-width:0}
  .team-row{grid-template-columns:auto 1fr auto}.team-row .muted{display:none}
  .cmp{grid-template-columns:1fr 84px 1fr}.cmp .val{font-size:19px}.cmp .lab{font-size:12px}
  .spot{grid-template-columns:1fr}
  .pc .pcg,.pcg3{grid-template-columns:minmax(0,1fr)}
  .tlay{grid-template-columns:minmax(0,1fr)}.tside{position:static}
  .rung{grid-template-columns:38px auto minmax(0,1fr) 56px;padding:10px 12px;gap:10px}.rung .mv,.rung .pbar{display:none}.rnum{font-size:30px}.pv{font-size:20px}
}
@media (max-width:560px){.g5,.g4,.g3{grid-template-columns:1fr 1fr}.poll .rk{font-size:34px}.giant{font-size:56px}}
/* ---- calmer, smaller pass ---- */
body{font-size:14px}
h1.huge{font-size:clamp(34px,4.6vw,52px)!important;line-height:.95}
.under{width:72px;height:4px;margin:8px 0 10px}
.kicker{font-size:13px}
.sec{margin-top:26px}

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const T = D.teams;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (x, d=1) => (x === null || x === undefined || Number.isNaN(x)) ? '–' : Number(x).toFixed(d);
const sgn = (x, d=1) => (x === null || x === undefined) ? '–' : (x > 0 ? '+' : (x < 0 ? '−' : '')) + Math.abs(x).toFixed(d);
const money = x => (x === null || x === undefined) ? '–' : (x < 0 ? '−$' : '+$') + Math.abs(x).toFixed(2);
const ord = n => n + (['th','st','nd','rd'][(n%100-20)%10] || ['th','st','nd','rd'][n%100] || 'th');
function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v);}catch(e){ return null; } }
let MY = store('myTeam') || D.my_team;
if(!T[MY]) MY = Object.keys(T)[0];

function badge(a, cls=''){ const t=T[a]||{c1:'#555',c2:'#999'};
  return `<span class="badge ${cls}" style="background:${t.c1};border:2px solid ${t.c2}">${esc(a)}</span>`; }
function recStr(t){ return t.rec ? `${t.rec.w}-${t.rec.l}-${t.rec.otl}` : '–'; }
function move(t){ if(t.move===null || t.move===undefined || t.move===0) return '<span class="muted">—</span>';
  return t.move>0 ? `<span class="up">▲${t.move}</span>` : `<span class="dn">▼${-t.move}</span>`; }

const ICON = {
  tonight:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  poll:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3a3 3 0 0 1-3 4M7 5H4a3 3 0 0 0 3 4"/></svg>',
  teams:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"/></svg>',
  record:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>',
  goalies:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16M10 4v16"/></svg>',
  standings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  trends:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3c2 4 6 5 6 10a6 6 0 0 1-12 0c0-3 2-4 3-6 1 2 2 3 3 3 0-3-1-5 0-7z"/></svg>',
  leaders:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
  price:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M8 18h2M12 18h4"/></svg>',
  compare:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v16M17 4v16M3 8l4-4 4 4M13 16l4 4 4-4"/></svg>',
  how:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 1-1 1.7M12 17h.01"/></svg>'
};
const PAGES = [['tonight','Tonight'],['trends','Trends'],['poll','Ladder'],['standings','Standings'],['leaders','Leaders'],['goalies','Goalies'],['compare','Compare'],['price','Price Check']];
const NAV_GROUPS = [['myteam'],['tonight'],['trends','poll','standings'],['leaders','goalies'],['compare','price']];

function nav(cur){
  const it=(k,l,ic)=>`<a href="#${k==='myteam'?'team/'+MY:k}" class="${cur===k?'on':''}">${ICON[ic]}<span>${l}</span></a>`;
  const lab = Object.fromEntries(PAGES);
  $('#nav').innerHTML = NAV_GROUPS.map(g=>g.map(k=>k==='myteam'?it('myteam','My Team','teams'):it(k,lab[k],k)).join('')).join('<span class="nsep"></span>');
}
function head(kicker, title, sub){
  return `<div class="kicker">${kicker}</div><h1 class="huge">${title}</h1><div class="under"></div>${sub?`<div class="sub">${sub}</div>`:''}`;
}
function secH(kicker, title){ return `<div class="sec-h"><div>${kicker?`<div class="kicker">${kicker}</div>`:''}<h2>${title}</h2></div></div>`; }

/* ---------------- TONIGHT ---------------- */
function pickGroups(picks){
  const byG = {};
  picks.forEach(p=>{ (byG[p.game]=byG[p.game]||[]).push(p); });
  const score = L => L.filter(p=>p.flag==='YES').length*10 + L.length;
  const order = Object.keys(byG).sort((a,b)=>score(byG[b])-score(byG[a]));
  return `<div class="pgrid">${order.map(gm=>{
    const L = byG[gm].sort((a,b)=>(a.flag==='YES'?0:1)-(b.flag==='YES'?0:1));
    const g = (D.tonight||[]).find(x=>x.game===gm) || {};
    const a = g.away, h = g.home, linked = L.length>1;
    const side = (ab,pct) => ab ? `<span class="pg-team">${badge(ab,'sm')}<b>${ab}</b>${pct!=null?`<span class="muted">${fmt(pct,0)}%</span>`:''}</span>` : '';
    return `<div class="pg">
      <div class="pg-hd">${a?`${side(a,g.away_win)}<span class="pg-at">@</span>${side(h,g.home_win)}`:`<b>${esc(gm)}</b>`}
        <span class="pg-n">${L.length} pick${L.length>1?'s':''}</span></div>
      <table class="pg-t"><thead><tr><th>Bet</th><th>Pick</th><th class="r">Odds</th><th class="r"></th></tr></thead><tbody>
      ${L.map(p=>`<tr><td class="muted">${esc(p.market)}</td><td><b>${esc(/^moneyline$/i.test(p.market)&&/^[A-Z]{3}$/.test(p.pick)?p.pick+' to win':p.pick)}</b></td><td class="r num"><b>${fmt(p.odds,2)}x</b></td><td class="r"><span class="tag ${p.flag}">${p.flag}</span></td></tr>`).join('')}
      </tbody></table>
      ${linked?'<div class="pg-note">These picks are linked: if one hits, the others are more likely to.</div>':''}
      ${a?keyWarn(a,h):''}</div>`; }).join('')}</div>`;
}
function pickCard(p){
  const g=(D.tonight||[]).find(x=>x.game===p.game);
  return `<div class="pick ${p.flag}"><div><span class="tag ${p.flag}">${p.flag}</span> ${p.corr?'<span class="tag corr" title="Same game as another pick. They tend to win or lose together.">SAME GAME</span>':''} <span class="muted" style="margin-left:6px">${esc(p.game)} · ${esc(p.market)}</span></div>
    <div class="sline" style="align-items:flex-end"><div class="pk">${esc(p.pick)}</div><div class="D" style="font-size:30px">${fmt(p.odds,2)}x</div></div>${g?keyWarn(g.away,g.home):''}</div>`;
}
function injShort(st){ const x=String(st||'').toLowerCase(); return x.includes('day')?'day-to-day':x.includes('reserve')||x==='ir'?'IR':x.includes('susp')?'suspended':x.includes('out')?'out':x; }
function injLine(ab){ const L=(T[ab]&&T[ab].inj)||[]; if(!L.length) return '';
  return `<div class="injl"><b>${ab} injuries:</b> ${L.slice(0,6).map(x=>`${esc(x.n)} <span class="muted">(${esc(x.pos)}${x.pos?', ':''}${injShort(x.st)})</span>`).join(', ')}${L.length>6?` <span class="muted">+${L.length-6} more</span>`:''}</div>`; }
function nk(x){ return String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z ]/g,'').trim(); }
function keyOut(ab){
  const t=T[ab]; if(!t||!t.inj||!t.inj.length) return [];
  const P=t.players||[], key=new Set();
  P.slice(0,3).forEach(p=>key.add(nk(p.name)));                                   // top 3 in points
  [...P].sort((a,b)=>(b.toi||0)-(a.toi||0)).slice(0,3).forEach(p=>key.add(nk(p.name)));  // top 3 in minutes
  if(t.goalies&&t.goalies[0]) key.add(nk(t.goalies[0].name));                      // main goalie
  return t.inj.filter(x=>key.has(nk(x.n))).map(x=>`${esc(String(x.n).split(' ').slice(-1)[0])}${injShort(x.st)==='day-to-day'?' (DTD)':''}`);
}
function keyWarn(away, home){
  const a=keyOut(away), h=keyOut(home); if(!a.length && !h.length) return '';
  return `<div class="kwarn">⚠ Key players out: ${[a.length?`<b>${away}</b> ${a.join(', ')}`:'', h.length?`<b>${home}</b> ${h.join(', ')}`:''].filter(Boolean).join(' · ')}</div>`;
}
function injCard(t){
  if(!D.meta.inj_ok) return '';
  const L=t.inj||[];
  return `<div class="sec card">${secH('Injury report','Injuries')}${L.length?`<div class="tablewrap"><table><thead><tr><th>Player</th><th>Pos</th><th>Status</th><th>Since</th><th>Note</th></tr></thead><tbody>${L.map(x=>`<tr><td><b>${esc(x.n)}</b></td><td class="muted">${esc(x.pos)}</td><td><span class="ist ${injShort(x.st).replace(/[^a-z]/gi,'')}">${esc(injShort(x.st))}</span></td><td class="muted">${esc(x.d)}</td><td class="muted" style="white-space:normal;min-width:220px">${esc(x.note)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="note">No injuries listed.</div>'}<div class="note">Source: ESPN</div></div>`;
}
function gameCard(g){
  const a=T[g.away], h=T[g.home];
  return `<div class="game">
    <div class="hd"><span class="label">${esc(g.away)} @ ${esc(g.home)}</span><span class="muted" style="font-size:13px">Projected score ${esc(g.proj)}</span></div>
    <div class="team-row">${badge(g.away,'sm')}<a class="tn" href="#team/${g.away}">${esc(a?a.name:g.away)}</a><span class="muted" style="font-size:13px">${esc(g.away_goalie||'')}</span><span class="pct">${fmt(g.away_win,0)}%</span></div>
    <div class="winbar"><i style="width:${g.away_win}%;background:${a?a.c1:'#999'}"></i><i style="width:${g.home_win}%;background:${h?h.c1:'#555'}"></i></div>
    <div class="team-row">${badge(g.home,'sm')}<a class="tn" href="#team/${g.home}">${esc(h?h.name:g.home)}</a><span class="muted" style="font-size:13px">${esc(g.home_goalie||'')}</span><span class="pct">${fmt(g.home_win,0)}%</span></div>
    ${keyWarn(g.away,g.home)}${injLine(g.away)}${injLine(g.home)}
    <div class="sides">${g.sides.length?g.sides.map(s=>`<div class="sline" style="padding:6px 0;border-top:1px solid #edf1f5"><span><span class="tag ${s.flag}">${s.flag}</span> <b>${esc(s.pick)}</b> <span class="muted">${esc(s.market)}</span></span><span class="D" style="font-size:20px">${fmt(s.odds,2)}x</span></div>`).join(''):'<div class="note">No bets on this game.</div>'}</div>
  </div>`;
}
function propTable(kind){
  const rows = (D.props[kind]||[]);
  if(!rows.length) return `<div class="empty">No ${kind==='alt'?'alt line':kind} bets tonight.</div>`;
  return `<div class="card tablewrap"><table><thead><tr><th>${kind==='alt'?'Game':(kind==='saves'?'Goalie':'Player')}</th><th>Pick</th><th>Flag</th><th>Odds</th></tr></thead><tbody>
  ${rows.map(r=>`<tr class="f${r.flag}"><td><b>${esc(r.who)}</b> ${r.team?`<span class="muted">${esc(r.team)}</span>`:''}</td><td>${esc(r.pick)}</td><td><span class="tag ${r.flag}">${r.flag}</span></td><td class="num">${fmt(r.odds,2)}x</td></tr>`).join('')}
  </tbody></table></div>`;
}
let propTab = store('propTab') || 'shots';
function pTonight(){
  const g = D.tonight, picks = D.picks;
  const y = picks.filter(p=>p.flag==='YES').length, l = picks.filter(p=>p.flag==='LEAN').length;
  let h = g.length?`<div class="tklab">Chance to win tonight · tap a game to compare</div><div class="ticker">${g.map(x=>{const ny=x.sides.filter(s=>s.flag==='YES').length, nl=x.sides.filter(s=>s.flag==='LEAN').length;
     return `<a class="tk" href="#compare/${x.away}/${x.home}"><span>${badge(x.away,'sm')} <b>${x.away}</b> <span class="D">${fmt(x.away_win,0)}%</span></span><span>${badge(x.home,'sm')} <b>${x.home}</b> <span class="D">${fmt(x.home_win,0)}%</span></span>${ny?`<span class="tkf YES">✓ ${ny} YES</span>`:nl?`<span class="tkf LEAN">✓ ${nl} LEAN</span>`:''}</a>`}).join('')}</div>`:'';
  h += head('Model board · '+esc(D.meta.date_long), 'Tonight', `${g.length} games · ${y} YES · ${l} LEAN · odds from ${esc(D.meta.odds_from)}`);
  if(g.length){
    const gotn = [...g].sort((x,y)=>((T[y.away].power+T[y.home].power)-Math.abs(y.home_win-50)/25)-((T[x.away].power+T[x.home].power)-Math.abs(x.home_win-50)/25))[0];
    const up = D.picks.filter(p=>p.market==='Moneyline' && p.odds>=2).sort((a,b)=>b.odds-a.odds)[0];
    h += `<div class="grid g2 sec">
      <a class="spot" href="#compare/${gotn.away}/${gotn.home}"><div style="display:flex;gap:8px">${badge(gotn.away)}${badge(gotn.home)}</div>
        <div><div class="red-k">GAME OF THE NIGHT</div><div class="big">${esc(T[gotn.away].name)} at ${esc(T[gotn.home].name)}</div>
        <div class="muted">Power rank #${T[gotn.away].rank} vs #${T[gotn.home].rank} · ${esc(gotn.away_win>=gotn.home_win?T[gotn.away].name:T[gotn.home].name)} ${fmt(Math.max(gotn.away_win,gotn.home_win),0)}% to win · tap to compare</div></div></a>
      ${up?`<a class="spot" href="#team/${up.pick}"><div>${badge(up.pick,'lg')}</div><div><div class="red-k">UPSET WATCH</div><div class="big">${esc(T[up.pick]?T[up.pick].name:up.pick)} at ${fmt(up.odds,2)}x</div>
        <div class="muted">Underdog with a ${up.flag} flag tonight.</div></div></a>`:''}

function ppRun(){
  const P=PCD.props, shots=pcMode==='shots', G=shots?P.shots:P.saves, list=shots?(G.players[PP.team]||[]):(G.goalies[PP.team]||[]), x=list[+PP.i];

  const li=G.lines.indexOf(parseFloat(PP.line)), pov=grid(G,proj,li), pun=1-pov, fee=PP.app==='Predicts'?PCD.k[3]:0;
  const vo=verdict(pov,PP.ov,PP.un,fee), vu=verdict(pun,PP.un,PP.ov,fee), lean=pov>=0.5?'Over':'Under';
  $('#ppout').innerHTML=`<div class="sec spot" style="grid-template-columns:auto 1fr">${badge(PP.team,'lg')}<div><div class="red-k">${esc(x[0]).toUpperCase()} VS ${PP.opp}</div>

    <div class="sec card tablewrap"><table><thead><tr><th>Pick</th><th>Your odds</th><th>Verdict</th></tr></thead><tbody>
     ${[['Over '+PP.line,vo],['Under '+PP.line,vu]].map(([pk,v])=>`<tr class="f${v&&v.v!=='PASS'?v.v:''}"><td><b>${esc(pk)}</b></td><td class="num">${v?fmt(v.d,2)+'x':'<span class="muted">enter odds</span>'}</td><td>${v?vtag(v.v):''}</td></tr>`).join('')}</tbody></table></div>`;
}
function pcRun(){
  const a=PC.a, h=PC.h; if(a===h){ $('#pcout').innerHTML='<div class="empty">Pick two different teams.</div>'; return; }
  const na=(PCD.g[a]||[]).length, base=((+PC.hg)*na+(+PC.ag))*13, str=PCD.P[h][a], row=[]; for(let i=0;i<13;i++) row.push(parseInt(str.substr((base+i)*2,2),36)/1000);
  const [W,EB,ES,FEE]=PCD.k, fee=PC.app==='Predicts'?FEE:0;
  const pli=PLL.indexOf(parseFloat(PC.pl)), tli=TLL.indexOf(parseFloat(PC.tl)); const plv=PLL[pli<0?1:pli], tlv=TLL[tli<0?2:tli];
  const ph=row[0], hpl=row[1+(pli<0?1:pli)], ov=row[5+2*(tli<0?2:tli)], un=row[6+2*(tli<0?2:tli)];
  const plpush = 0, apl=1-hpl, tpush=1-ov-un;
  const out=[];
  const side=(mk,pick,p,o,oth,push)=>{ const d=toDec(o); if(!d){ out.push({mk,pick,v:''}); return; }
    const eff=1/(1/d+fee), od=toDec(oth); let m=null; if(od){ const p1=1/d,p2=1/od; m=p1/(p1+p2)*(1-push); }
    const pb=m==null?p:W*p+(1-W)*m, e1=p*(eff-1)-(1-p-push), e2=pb*(eff-1)-(1-pb-push), bar=EB+ES*Math.max(0,d-1.5);
    out.push({mk,pick,d,v:(m!=null&&e2>=bar)?'YES':(e1>=bar?'LEAN':'PASS')}); };
  side('Moneyline',a,1-ph,PC.aml,PC.hml,0); side('Moneyline',h,ph,PC.hml,PC.aml,0);
  side('Puck line',`${h} ${plv>0?'+':''}${plv}`,hpl,PC.hpl,PC.apl,plpush); side('Puck line',`${a} ${-plv>0?'+':''}${-plv}`,apl,PC.apl,PC.hpl,plpush);
  side('Total',`Over ${tlv}`,ov,PC.ov,PC.un,tpush); side('Total',`Under ${tlv}`,un,PC.un,PC.ov,tpush);
  const fav = ph>=0.5?h:a, fp=Math.max(ph,1-ph);
  $('#pcout').innerHTML = `<div class="sec spot" style="grid-template-columns:auto 1fr">${badge(fav,'lg')}<div><div class="red-k">MODEL'S PICK TO WIN</div><div class="big">${esc(T[fav].name)} · ${fmt(100*fp,0)}%</div>
      <div class="winbar" style="margin:8px 0 0"><i style="width:${100*(1-ph)}%;background:${T[a].c1}"></i><i style="width:${100*ph}%;background:${T[h].c1}"></i></div></div></div>
    <div class="sec card tablewrap"><table><thead><tr><th>Pick</th><th>Your odds</th><th>Verdict</th></tr></thead><tbody>
    ${out.map(r=>`<tr class="f${r.v==='PASS'?'':r.v}"><td><b>${esc(r.pick)}</b> <span class="muted">${r.mk}</span></td><td class="num">${r.d?fmt(r.d,2)+'x':'<span class="muted">enter odds</span>'}</td>
      <td>${r.v==='YES'?'<span class="tag YES">✓ BET</span>':r.v==='LEAN'?'<span class="tag LEAN">LEAN</span>':r.v==='PASS'?'<span class="tag SKIP">PASS</span>':''}</td></tr>`).join('')}</tbody></table></div>`;
}

  h+=`<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0 18px"><select class="big" id="ca">${opt(a)}</select><span class="label">VS</span><select class="big" id="cb">${opt(b)}</select></div>
  <div class="card top-ln"><div style="display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center">
   <a href="#team/${a}" class="cside l">${badge(a,'lg')}<div class="cnm">${esc(A.name)}</div><div class="muted">${recStr(A)}</div></a>
   <div><div class="red-k">NEUTRAL ICE</div><div class="giant" style="font-size:44px">${fmt(Math.max(neu,100-neu),0)}<span style="font-size:20px">%</span></div><div class="muted">${neu>=50?a:b} to win</div></div>
   <a href="#team/${b}" class="cside r">${badge(b,'lg')}<div class="cnm">${esc(B.name)}</div><div class="muted">${recStr(B)}</div></a></div>
   <div class="winbar" style="margin:16px 0 4px;height:12px"><i style="width:${neu}%;background:${A.c1}"></i><i style="width:${100-neu}%;background:${B.c1}"></i></div>
   <div class="grid g3 sec" style="margin-top:16px"><div class="tile"><div class="kicker" style="font-size:11px">At ${a}</div><div class="v">${a} ${fmt(ah,0)}%</div></div>
   <div class="tile"><div class="kicker" style="font-size:11px">At ${b}</div><div class="v">${a} ${fmt(100-bh,0)}%</div></div>
   <div class="tile"><div class="kicker" style="font-size:11px">Season series</div><div class="v">${ser.length?`${a} ${aw}-${bw}`:'No games yet'}</div><div class="muted" style="font-size:12px">${ser.map(r=>`${esc(r[0])}: ${r[1]} ${r[3]}-${r[4]} ${r[2]}${r[5]?' OT':''}`).join(' · ')}</div></div></div></div>
  <div class="sec card top-ln">${secH('Side by side','Tale of the Tape')}${rows.map(([lab,f,fm,low,lo,hi,desc])=>{const va=f(A),vb=f(B); if(va==null||vb==null) return '';
    const better=low?(va<vb?'a':vb<va?'b':''):(va>vb?'a':vb>va?'b':''); const wa=fill(va,lo,hi), wb=fill(vb,lo,hi);
    const col=w=>better===''?'#9aa6b5':(better===w?'var(--green)':'var(--red)');
    return `<div class="cmp"><div class="l"><div class="val" style="color:${col('a')}">${fm(va)}</div><div class="bar"><i style="width:${wa}%;background:${col('a')}"></i></div></div><div class="lab">${lab}<span class="ldesc">${desc}</span></div><div><div class="val" style="color:${col('b')}">${fm(vb)}</div><div class="bar"><i style="width:${wb}%;background:${col('b')}"></i></div></div></div>`}).join('')}
   <div class="note">Green is the better side. Longer bars are better relative to the league. Win % assumes average goalies and no back-to-backs.</div></div>`;
  $('#view').innerHTML=h;
  $('#ca').onchange=e=>location.hash=`#compare/${e.target.value}/${b}`; $('#cb').onchange=e=>location.hash=`#compare/${a}/${e.target.value}`;
}

/* ---------------- shell ---------------- */
function topbar(){
  const s = $('#mySel');
  s.innerHTML = Object.values(T).sort((a,b)=>a.abbr.localeCompare(b.abbr)).map(t=>`<option value="${t.abbr}" ${t.abbr===MY?'selected':''}>${t.abbr}</option>`).join('');
  $('#myBadge').innerHTML = `<a href="#team/${MY}" title="My team">${badge(MY,'sm')}</a>`;
  $('#when').textContent = 'Updated ' + D.meta.updated;
  const st=$('#stale'); if(D.meta.gen && Date.now()-D.meta.gen > 30*3600*1000){ st.hidden=false; st.textContent=`Last updated ${D.meta.updated}. Games and picks may be out of date.`; }
  s.onchange = () => { MY = s.value; store('myTeam', MY); location.hash = '#team/' + MY; topbar(); };
  route();
}
function route(){
  const h = (location.hash || '#tonight').slice(1); const [p, arg] = h.split('/');
  if(p==='team' && arg){ nav(arg===MY?'myteam':'teams'); pTeam(arg); }
  else if(p==='compare'){ nav('compare'); const parts=h.split('/'); pCompare(parts[1],parts[2]); }
  else { const pg = PAGES.find(x=>x[0]===p) ? p : 'tonight'; nav(pg);
    if(p==='teams'){ location.hash='#standings'; return; }
    ({tonight:pTonight, poll:pPoll, standings:pStandings, teams:pTeams, trends:pTrends, price:pPrice, leaders:pLeaders, record:pTonight, goalies:pGoalies})[pg](); }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
topbar();
</script>
</body>
</html>
